<text x="45" y="1358" font-family="Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="18" fill="#18232e">LLM 不是每轮必经规划器；补充信息后重评规则 / Jev，不永久切换到 LLM 模式。</text>
<text x="45" y="1395" font-family="Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="17" fill="#526171">完成 / 部分完成 / 需用户信息 / 停止 / 未知均有明确结果；模型切换不重置授权、预算、动作回执。</text>
