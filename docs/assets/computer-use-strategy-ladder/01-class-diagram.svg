<text x="55" y="1016" font-family="Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="18" fill="#18232e">ActionSet 绑定目标与观察版本；每条动作绑定 TargetRef、参数、前置条件和预期效果。</text>
<text x="55" y="1054" font-family="Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="18" fill="#18232e">TargetRef 保留 DOM / AX / 图像的不同身份；模型不得自由拼接任意 target / action / value。</text>
<text x="55" y="1133" font-family="Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="18" fill="#526171">执行与核验同样使用 TaskSession；为简洁省略重复依赖线。Jev 和 LLM 均不直接派发 OS 操作。</text>
