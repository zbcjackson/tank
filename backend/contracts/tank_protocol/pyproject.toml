[project]
name = "tank-protocol"
version = "0.3.0"
description = "Tank Voice Assistant - client WebSocket wire contract (single source of truth)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
