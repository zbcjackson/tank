[tool.uv.workspace]
members = [
    "core",
    "contracts",
    "contracts/tank_protocol",
    "plugins/*",
]

[tool.uv.sources]
tank-contracts = { workspace = true }

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "scipy>=1.15.3,<1.18",
]

[tool.pytest.ini_options]
testpaths = ["core/tests", "contracts", "plugins"]
addopts = "--import-mode=importlib"
pythonpath = ["core/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
extraPaths = ["core/tests"]
