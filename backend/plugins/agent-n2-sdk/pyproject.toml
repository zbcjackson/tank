[project]
name = "agent-n2-sdk"
version = "0.1.0"
description = "Official Navigator n2 SDK subagent for Tank"
requires-python = ">=3.10"
dependencies = ["tank-backend", "yutori[macos]==0.9.29"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
tank-backend = { workspace = true }
