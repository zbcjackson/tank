[project]
name = "agent-computer-use"
version = "0.1.0"
description = "Host-driven computer-use subagent for Tank"
requires-python = ">=3.10"
dependencies = ["tank-backend"]

[project.optional-dependencies]
browser = ["playwright==1.58.0"]
vision = ["pyobjc-framework-Vision==12.2; sys_platform == 'darwin'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
tank-backend = { workspace = true }
