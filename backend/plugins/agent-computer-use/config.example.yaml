# Merge into the host config. Enable the plugin and select an extension agent
# with `decision-model: jev` explicitly; this file changes no production defaults.
# The named Jev model belongs in core/config.yaml, not this plugin config.
subagents:
  agent-computer-use:agent:
    config:
      browser:
        scope: managed-page
        url: http://127.0.0.1:8080/form
      selector: jev
