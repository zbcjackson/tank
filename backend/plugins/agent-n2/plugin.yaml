name: agent-n2
display_name: Navigator n2
description: Desktop agent using Yutori Navigator n2
extensions:
  - name: agent
    type: agent
    runtime_api: 1
    model_inputs: [text, image]
    permissions: [desktop, shell, filesystem, network]
    factory: agent_n2:create_agent
    needs: [desktop_executor, task_runtime, task_model]
