[project]
name = "agent-n2"
version = "0.1.0"
description = "Navigator n2 desktop agent for Tank"
requires-python = ">=3.10"
dependencies = ["tank-backend", "openai>=1.0.0", "pillow>=10.0.0"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
tank-backend = { workspace = true }
