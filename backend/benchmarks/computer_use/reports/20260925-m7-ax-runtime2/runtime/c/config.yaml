agents:
  dirs:
  - agents
  llm_profile: planner
llm:
  default:
    api_key: ${M5_DASHSCOPE_API_KEY}
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    capabilities: &id001
    - text
    - image
    extra_body: &id002
      enable_thinking: false
    extra_headers: &id003
      HTTP-Referer: http://localhost:3000
      X-Title: Tank Voice Assistant
    max_tokens: 8000
    model: qwen3.7-flash-2026-07-15
    stream_options: true
    temperature: 0.1
  locator:
    api_key: ${M5_DASHSCOPE_API_KEY}
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    capabilities: *id001
    extra_body: *id002
    extra_headers: *id003
    max_tokens: 8000
    model: qwen3.8-max-2026-09-02
    stream_options: true
    temperature: 0.1
  planner:
    api_key: ${M5_DASHSCOPE_API_KEY}
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    capabilities: *id001
    extra_body: *id002
    extra_headers: *id003
    max_tokens: 8000
    model: qwen3.7-flash-2026-07-15
    stream_options: true
    temperature: 0.1
toolsets:
  profiles:
    computer_use:
      tools:
      - screenshot
      - click
      - type_text
      - key_press
      - scroll
      - mouse_move
      - mouse_down
      - mouse_up
      - hold_key
      - drag
      - computer_batch
      - launch_app
