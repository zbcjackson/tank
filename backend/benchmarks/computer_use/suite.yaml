# computer_use 套件：桌面 GUI 任务基准
#
# 安全提示：agent 会真实操控键鼠，且全屏截图会上传给 LLM 供应商——
# 强烈建议在专用 macOS 用户账户 / 独立 GUI VM 中跑批（无钥匙串、无
# 浏览器登录态、无敏感 App）。逐动作审批在 Part A 阶段 4a 才落地。
#
# 环境钉死（跑批前人工执行）：
#   - 输入法（最确定）：系统设置→键盘→输入法，临时只保留 ABC/英文，跑完再加回中文。
#     必须复查真的删掉了（iCloud 输入法同步会加回来）：
#       defaults read com.apple.HIToolbox AppleEnabledInputSources
#     输出不应含 com.apple.inputmethod.SCIM——残留的中文 IME 会按 App 粘滞在被
#     agent 打开的 Terminal/Finder 里吃掉合成按键的裸 - 和 .（2026-09-10 实证）。
#     同时勾选"所有文稿使用同一输入源"可关掉按 App 粘滞，作为兜底。
#     自动钉定为尽力而为，无法改前台 App 的粘滞输入源
#   - 只接一块显示器（v1 单屏假设：截屏只含主屏，新 App 出现在最近
#     有焦点的屏幕上，双屏会让模型看不到自己启动的应用）
#   - 分辨率/缩放固定；关闭通知与自动更新（抢焦点）
#   - 输入法切英文（任务内中文经剪贴板路径输入）
#   - Dock/任务栏保持默认布局；跑批期间不碰键鼠
name: computer_use
description: "Desktop GUI tasks for the computer_use sub-agent (real screen, real input)"
agent: computer_use
assets: assets
server_port: 8901
defaults:
  trials: 3
  timeout_s: 180
  # max_steps is the fast-fail knob: a wandering agent (misclicks and
  # retries) aborts after this many executed actions instead of burning
  # the full timeout. Timeout is the backstop.
  max_steps: 15
