id: browser-navigate
category: browser
difficulty: 1
platforms: [macos, linux]
instruction: |
  打开浏览器（macOS: Safari；Linux: Firefox），通过地址栏访问
  http://localhost:8901/checkin.html ，然后点击页面上的「报到」按钮。
  看到页面显示「已报到」即完成。
setup: |
  true
validator:
  kind: shell
  command: >-
    python3 -c "import json,sys;
    es=[json.loads(l) for l in open(sys.argv[1])];
    sys.exit(0 if any(e.get('kind')=='click' and e.get('name')=='checkin' for e in es) else 1)"
    "$BENCH_CAPTURE"
teardown: |
  true
teardown_macos: |
  killall Safari 2>/dev/null || true
timeout_s: 300
