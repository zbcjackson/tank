id: window-copy
category: multi-window
difficulty: 3
platforms: [macos, linux]
instruction: |
  先用文本编辑器打开文件 ~/bench-work/source.txt（里面有且仅有一句话），
  全选并复制这句话（cmd+a cmd+c / ctrl+a ctrl+c）。然后打开浏览器访问
  http://localhost:8901/typing.html ，把这句话粘贴到文本框（cmd+v / ctrl+v），
  点击「提交」直到页面显示「已提交」。
setup: |
  rm -rf ~/bench-work && mkdir -p ~/bench-work
  printf '跨窗口复制是桌面自动化的基本功。' > ~/bench-work/source.txt
validator:
  kind: shell
  command: >-
    python3 -c "
    import json,sys
    es=[json.loads(l) for l in open(sys.argv[1])]
    ok=any(e.get('kind')=='submit' and e.get('payload',{}).get('text','').strip()=='跨窗口复制是桌面自动化的基本功。' for e in es)
    sys.exit(0 if ok else 1)"
    "$BENCH_CAPTURE"
teardown: |
  rm -rf ~/bench-work
teardown_macos: |
  rm -rf ~/bench-work
  killall TextEdit 2>/dev/null || true
  killall Safari 2>/dev/null || true
timeout_s: 420
