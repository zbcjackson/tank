id: typing-fidelity
category: typing
difficulty: 2
platforms: [macos, linux]
instruction: |
  打开浏览器访问 http://localhost:8901/typing.html ，把下面这段文字一字不差地
  输入到文本框中，然后点击「提交」按钮，直到页面显示「已提交」：

  今天我们要测试 Tank 助手的桌面自动化能力。It must type both Chinese and
  English correctly, including punctuation like commas、periods. 第二段包含
  数字 12345 与符号 #¥%*&，请完整保留所有字符，不要增删或改写任何内容。

setup: |
  rm -rf ~/bench-work && mkdir -p ~/bench-work
validator:
  kind: shell
  command: |
    python3 -c "
    import json,sys
    want=open(sys.argv[2],encoding='utf-8').read().strip()
    es=[json.loads(l) for l in open(sys.argv[1])]
    ok=any(e.get('kind')=='submit' and e.get('payload',{}).get('text','').strip()==want for e in es)
    sys.exit(0 if ok else 1)" "$BENCH_CAPTURE" "$BENCH_ASSETS_DIR/paragraph.txt"
teardown: |
  rm -rf ~/bench-work
teardown_macos: |
  rm -rf ~/bench-work
  killall Safari 2>/dev/null || true
timeout_s: 420
