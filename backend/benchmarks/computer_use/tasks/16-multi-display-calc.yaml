# 多显示器任务：要求真实双屏环境（min_displays: 2）。
# 单屏环境跑批时该任务被 runner 显式跳过并记录 skipped_tasks，不进成功率分母。
# 验证 = 业务结果（calc_validator 严格 7×8/56，前台 Calculator AX 显示）
#       && 窗口位置（display_validator：Calculator 完整位于非主显示器）。
# 不验证副屏截图像素——那会把「截图过」当「算对过」。
id: multi-display-calc
category: multi-window
difficulty: 2
platforms: [macos]
min_displays: 2
gui_only: true
instruction: |
  本机连接了多台显示器。多屏截图结果会列出所有显示器的 display id、
  主屏标记和各自布局；坐标工具都接受 display=<id> 参数，缺省指向最近
  一次截图的显示器；drag 还接受 display2（拖拽终点所在屏）。
  请完成：
  1. 分别截取主屏与非主屏（记下两者的 display id）。
  2. Calculator 已在主屏打开。用 drag 抓住它的标题栏，把它整体拖到非主
     显示器上（drag 的起点用主屏坐标，终点用非主屏坐标 + display2）。
  3. 用鼠标点击按钮算出 7×8（注意点击坐标属于 Calculator 所在的屏）。
  4. 对该显示器截图，确认 7×8 和 56 显示在屏幕上。
  全程不要把 Calculator 窗口移回主显示器。
setup: |
  pkill -x Calculator 2>/dev/null; python -m tank_backend.benchmarks.calc_validator --reset; true
validator:
  kind: shell
  command: python -m tank_backend.benchmarks.calc_validator && python -m tank_backend.benchmarks.display_validator --calculator-on-secondary
teardown: |
  killall Calculator 2>/dev/null || true
timeout_s: 180
scoring: strict
