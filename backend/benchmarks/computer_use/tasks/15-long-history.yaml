id: long-history
gui_only: true
category: typing
difficulty: 3
platforms: [macos]
instruction: |
  打开文本编辑器（TextEdit），新建一个文档。依次输入 16 行文本，第 N 行的
  内容恰好是：第 N 行：N 乘以 7 等于 <N×7 的结果>（例如第 3 行是
  「第 3 行：3 乘以 7 等于 21」）。每输入完 4 行，截图核对一次已输入的内容，
  发现错误立即修正再继续。16 行全部输入并核对完成后结束，文档保持打开。
setup: |
  true
validator:
  kind: shell
  command: >-
    osascript -e 'tell application "TextEdit" to get text of front document'
    | python3 -c "import sys; t=sys.stdin.read();
    lines=[l.strip() for l in t.splitlines() if l.strip()];
    want=[f'第 {n} 行：{n} 乘以 7 等于 {n*7}' for n in range(1,17)];
    sys.exit(0 if lines==want else 1)"
teardown: |
  killall TextEdit 2>/dev/null || true
timeout_s: 600
max_steps: 60

scoring: strict  # Long-history acceptance: full 16-line content in order.
