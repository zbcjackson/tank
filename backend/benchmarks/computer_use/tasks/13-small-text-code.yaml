id: small-text-code
category: browser
difficulty: 3
platforms: [macos, linux]
instruction: |
  打开浏览器访问 http://localhost:8901/smalltext.html 。页面中部有一行很小的
  8 位验证码（小字）。仔细看清它，然后在下方输入框里原样输入这 8 位验证码，
  点击「提交」，直到页面显示「已提交」。
setup: |
  true
validator:
  kind: shell
  command: |
    python3 -c "
    import json,sys
    es=[json.loads(l) for l in open(sys.argv[1])]
    ok=any(e.get('kind')=='submit' and e.get('payload',{}).get('code')=='K7QM29XZ' for e in es)
    sys.exit(0 if ok else 1)" "$BENCH_CAPTURE"
teardown: |
  true
teardown_macos: |
  killall Safari 2>/dev/null || true
timeout_s: 180
