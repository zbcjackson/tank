id: reduce-motion
category: settings
difficulty: 2
platforms: [macos, linux]
instruction: |
  通过系统设置的图形界面（不要用终端）关闭动画效果：
  macOS: 系统设置 → 辅助功能 → 显示 → 打开「减少动态效果」(Reduce motion)；
  Linux: 设置 → 辅助功能 → 打开「减少动画」(Reduce animation)。
setup_linux: |
  gsettings set org.gnome.desktop.interface enable-animations true
setup_macos: |
  defaults write com.apple.universalaccess reduceMotion -bool false
validator_linux:
  kind: shell
  command: test "$(gsettings get org.gnome.desktop.interface enable-animations)" = "false"
validator_macos:
  kind: shell
  command: test "$(defaults read com.apple.universalaccess reduceMotion)" = "1"
teardown_linux: |
  gsettings set org.gnome.desktop.interface enable-animations true
teardown_macos: |
  defaults write com.apple.universalaccess reduceMotion -bool false
timeout_s: 180
