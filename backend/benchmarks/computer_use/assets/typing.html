<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>文字输入</title>
<style>
  body { font-family: system-ui, sans-serif; display: flex; justify-content: center;
         padding-top: 8vh; background: #f5f5f7; }
  .card { background: #fff; border-radius: 16px; padding: 40px 48px; width: 560px;
          box-shadow: 0 4px 24px rgba(0,0,0,.08); }
  h1 { font-size: 22px; }
  textarea { width: 100%; box-sizing: border-box; height: 180px; padding: 12px;
             font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
  button { margin-top: 22px; padding: 12px 40px; font-size: 17px; color: #fff;
           background: #2563eb; border: 0; border-radius: 10px; cursor: pointer; }
  .ok { margin-top: 18px; font-size: 18px; color: #16a34a; font-weight: 600; }
</style></head>
<body>
<div class="card">
  <h1>请把指定文字输入到下面的文本框</h1>
  <textarea id="text" autocomplete="off"></textarea>
  <button onclick="submitText()">提交</button>
  <div class="ok" id="ok" hidden>已提交</div>
</div>
<script>
async function submitText() {
  const payload = {text: document.getElementById('text').value};
  await fetch('/submit', {method: 'POST', headers: {'Content-Type': 'application/json'},
                          body: JSON.stringify(payload)});
  document.getElementById('ok').hidden = false;
}
</script>
</body></html>
