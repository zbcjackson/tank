<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>会议签到</title>
<style>
  body { font-family: system-ui, sans-serif; display: flex; justify-content: center;
         padding-top: 20vh; background: #f5f5f7; }
  .card { background: #fff; border-radius: 16px; padding: 48px 56px; width: 420px;
          box-shadow: 0 4px 24px rgba(0,0,0,.08); text-align: center; }
  h1 { font-size: 22px; }
  button { margin-top: 28px; padding: 16px 72px; font-size: 22px; color: #fff;
           background: #2563eb; border: 0; border-radius: 12px; cursor: pointer; }
  .ok { margin-top: 22px; font-size: 22px; color: #16a34a; font-weight: 600; }
</style></head>
<body>
<div class="card">
  <h1>今日会议签到</h1>
  <button onclick="checkin()">报到</button>
  <div class="ok" id="ok" hidden>已报到</div>
</div>
<script>
async function checkin() {
  await fetch('/click?name=checkin');
  document.getElementById('ok').hidden = false;
}
</script>
</body></html>
