name: Backend CI

# Disabled: no automatic runs on push/PR. Manual dispatch only — restore the
# push/pull_request triggers below to re-enable.
on:
  workflow_dispatch:
  # push:
  #   branches: [master]
  #   paths:
  #     - "backend/**"
  #     - ".github/workflows/backend-ci.yml"
  # pull_request:
  #   paths:
  #     - "backend/**"
  #     - ".github/workflows/backend-ci.yml"

jobs:
  managed-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install workspace and browser extra
        working-directory: backend
        run: uv sync --locked --all-packages --all-groups --extra browser
      - name: Install Chromium
        working-directory: backend
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Require real Chromium acceptance
        working-directory: backend
        env:
          TANK_REQUIRE_CHROMIUM: '1'
        run: uv run --no-sync pytest plugins/agent-computer-use/tests/test_dom.py -q

  docker-smoke:
    # Install smoke (s2s analog): build the service image, start it in a
    # clean container, and require /api/health to answer.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build service image
        run: docker build -t tank-backend:smoke ./backend

      - name: Start container
        run: |
          docker run -d --name tank-smoke \
            -e LLM_API_KEY=smoke-dummy-key \
            -p 8000:8000 \
            tank-backend:smoke

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health >/dev/null 2>&1; then
              echo "backend healthy after $i attempts"
              curl -fsS http://localhost:8000/api/health
              exit 0
            fi
            sleep 2
          done
          echo "::error::backend did not become healthy within 120s"
          docker logs tank-smoke
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f tank-smoke
